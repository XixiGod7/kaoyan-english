
        <div class="modal-content">
            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <h3 class="modal-title">2014年考研英语第1套</h3>
                    <span id="modalTitleNote" class="modal-title-note" style="display: none;">(注：听力与前2套一致，故未显示)</span>
                    <div id="knowledgeFilterContainer" style="display:none; align-items:center; gap:6px;margin-left: 20px;">
                        <select id="knowledgeFilterPart" class="form-select form-select-sm" style="min-width: 90px;">
                            <option value="">全部部分</option>
                            <option value="Part I">写作</option>
                            <option value="Part II">听力</option>
                            <option value="Part III">阅读</option>
                            <option value="Part IV">翻译</option>
                        </select>
                        <select id="knowledgeFilterSub" class="form-select form-select-sm" style="min-width: 110px;">
                            <option value="">所有题型</option>
                        </select>
                    </div>
                <span id="modalTitleScore" style="color: rgba(158, 150, 5, 0.663); font-size: 1em; font-weight: 600; margin-left: 10px; display: none; cursor: pointer;"></span></div>
                <div id="taskControls" style="margin-left: auto; display: flex; gap: 10px; align-items: center; ">
                    <div id="taskTimer" class="task-timer" style="margin-right: 35px; display: flex;">
                        <span>计时器</span>
                        <span id="taskTimerDisplay" class="timer-display">00:00</span>
                        <button id="taskTimerToggle" class="timer-btn timer-btn-toggle" type="button"></button>
                        <button id="taskTimerReset" class="timer-btn" type="button" style="width: auto;font-weight: normal;padding: 0 3px;">重置</button>
                    </div>
                    <div id="displayModeContainer" style="display: flex; align-items: center; gap: 10px; margin-right: 10px; margin-bottom: 0;">
                        <select id="displayModeSelect" class="form-select form-select-sm" style="min-width: 90px;" onchange="setDisplayMode(this.value)">
                            <option value="normal">默认背景</option>
                            <option value="eye">护眼模式</option>
                            <option value="night">夜间模式</option>
                        </select>
                    </div>

                    <button id="gradePaperBtn" class="btn btn-success btn-sm" style="display: block;" onclick="toggleGradePaper()">一键批改本卷</button>
                    <button id="practiceModeBtn" class="btn btn-primary btn-sm" style="margin-right: 1vw;" onclick="toggleViewMode()">切换到浏览模式</button>
                </div>
                <button type="button" class="modal-close modal-close-text" onclick="closeModal()">保存并关闭</button>
            </div>
            <div class="modal-body" id="modal-task-list"><iframe src="static/tasks.html?exam=2014(1)&amp;exam_type=kaoyan" style="width:100%; height:100%; border:none;"></iframe></div>
        </div>
