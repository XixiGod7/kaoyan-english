<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="10" filter="url(#glow)"/>
  
  <!-- Open Book Graphic -->
  <!-- Left Page -->
  <polygon points="252,320 116,285 116,150 252,175" fill="#ffffff"/>
  <!-- Right Page -->
  <polygon points="260,320 396,285 396,150 260,175" fill="#f8fafc"/>
  <!-- Spine Line -->
  <line x1="256" y1="175" x2="256" y2="325" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Page Lines Detail -->
  <line x1="140" y1="190" x2="230" y2="206" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="218" x2="230" y2="234" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="246" x2="230" y2="262" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>

  <line x1="282" y1="206" x2="372" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="282" y1="234" x2="372" y2="218" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="282" y1="262" x2="372" y2="246" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Golden Underline Accent Bar -->
  <rect x="136" y="360" width="240" height="38" rx="19" fill="#fef08a"/>
</svg>
